name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name : Download code
        uses: actions/checkout@v6

      - name : Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install project and test tools
        run: |
          python -m pip install -e 
          python - pip install pytest 

      - name: Run tests
        run: python -m pytest -v
        


